aid: latigo-bio
name: Latigo Bio
description: 'Latigo Biotherapeutics, Inc. ("Latigo Bio") is a clinical-stage biotechnology
  company headquartered in Thousand Oaks, California, developing novel non-opioid medicines
  for acute and chronic pain. Its lead candidates LTG-001 and LTG-321 are oral NaV1.8
  sodium-channel inhibitors targeting pain at its peripheral source without the addiction
  risk of opioids; LTG-001 holds FDA Fast Track designation and reported positive Phase 2b
  results in post-abdominoplasty acute pain, published in the New England Journal of
  Medicine in July 2026. The company was founded on human-genetics-validated targets and
  uses in-house AI/ML and structure-based drug design to optimize potency and selectivity.
  It debuted in 2024 with a $135M Series A and closed a $150M Series B in March 2025, backed
  by Westlake Village BioPartners, 5AM Ventures, Foresite Capital and Corner Ventures.
  Latigo is a therapeutics developer, not a software vendor: it publishes no public API,
  developer portal, SDK or machine-readable specification.'
